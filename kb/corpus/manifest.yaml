# RAG corpus manifest - AXI4 NoC with collective communication
# text/ = retrieval corpus (markdown, extracted from arXiv HTML via stdlib html.parser)
# pdf/  = archival copy
# Extraction notes: reference lists are DROPPED (LaTeXML ltx_bibliography subtree).
#   Section headings preserved as markdown headings. Equations inlined as $LaTeX$
#   from the MathML alttext attribute. Tables flattened to pipe-separated cells.

sources:
  - id: floonoc-collectives
    title: A Lightweight High-Throughput Collective-Capable NoC for Large-Scale ML Accelerators
    authors: Luca Colagrande et al.
    year: 2026
    url: https://arxiv.org/abs/2603.26438
    pdf: floonoc-collectives.pdf
    text: floonoc-collectives.md
    status: ok
    role: Primary reference for collective (multicast / reduction) extensions on a FlooNoC-style AXI4 mesh - NI, router multicast, narrow and wide reduction, system address map.
    word_count: 8572

  - id: axi-multicast-crossbar
    title: A Multicast-Capable AXI Crossbar for Many-core Machine Learning Accelerators
    authors: Luca Colagrande et al.
    year: 2025
    url: https://arxiv.org/abs/2502.19215
    pdf: axi-multicast-crossbar.pdf
    text: axi-multicast-crossbar.md
    status: ok
    role: Authoritative for AXI-level multicast semantics - multi-address encoding, AXI crossbar multicast extension, area and timing cost of multicast in an AXI interconnect.
    word_count: 2881

  - id: flatattention
    title: "FlatAttention: Dataflow and Fabric Collectives Co-Optimization for Efficient Multi-Head Attention on Tile-Based Many-PE Accelerators"
    authors: Chi Zhang et al.
    year: 2025
    url: https://arxiv.org/abs/2505.18824
    pdf: flatattention.pdf
    text: flatattention.md
    status: ok
    role: Conference version - workload-side motivation for fabric collectives, mapping multi-head attention onto a tile-based many-PE array with in-fabric collectives.
    word_count: 4056

  - id: flatattention-journal
    title: "FlatAttention: Dataflow and Fabric Collectives Co-Optimization for Large Attention-Based Model Inference on Tile-Based Accelerators"
    authors: Chi Zhang et al.
    year: 2026
    url: https://arxiv.org/abs/2604.02110
    pdf: flatattention-journal.pdf
    text: flatattention-journal.md
    status: ok
    role: Extended journal version of flatattention - deeper dataflow analysis, MoE inference, expanded evaluation. Prefer this over the conference version when the two overlap.
    word_count: 9271

  - id: attention-is-all-you-need
    title: Attention Is All You Need
    authors: Ashish Vaswani et al.
    year: 2017
    url: https://arxiv.org/abs/1706.03762
    pdf: attention-is-all-you-need.pdf
    text: attention-is-all-you-need.md
    status: ok
    role: Authoritative for multi-head attention and the Transformer - scaled dot-product attention, multi-head attention, encoder-decoder structure, positional encoding. Workload-side definition behind the attention benchmark (B4).
    word_count: 4967

  - id: floonoc
    title: "FlooNoC: A 645 Gbps/link 0.15 pJ/B/hop Open-Source Network-on-Chip with Wide Physical Links and End-to-End AXI4 Parallel Multi-Stream Support"
    authors: Tim Fischer et al.
    year: 2024
    url: https://arxiv.org/abs/2409.17606
    pdf: floonoc.pdf
    text: floonoc.md
    status: ok
    role: Base fabric reference - wide physical links, flit format, network interface with and without reorder buffer, router microarchitecture, AXI4 multi-stream mapping, physical implementation numbers.
    word_count: 9923

  - id: in-network-accumulation
    title: "In-Network Accumulation: Extending the Role of NoC for DNN Acceleration"
    authors: Binayak Tiwari et al.
    year: 2022
    url: https://arxiv.org/abs/2209.10056
    pdf: in-network-accumulation.pdf
    text: in-network-accumulation.md
    status: ok
    role: Prior art for compute-in-router - partial-sum accumulation inside the router for weight-stationary dataflow, latency and power gains versus PE-side accumulation.
    word_count: 4333

  - id: chipnemo
    title: "ChipNeMo: Domain-Adapted LLMs for Chip Design"
    authors: Mingjie Liu et al.
    year: 2023
    url: https://arxiv.org/abs/2311.00176
    pdf: chipnemo.pdf
    text: null
    status: pdf-only
    role: Methodology reference for domain-adapted LLM and retrieval pipelines in chip design. Archival only - already distilled into the chipnemo-domain-adaptation skill, so no text extraction is needed for retrieval.
    word_count: 0

  - id: amba-axi4
    title: AMBA AXI and ACE Protocol Specification (ARM IHI 0022)
    authors: Arm Ltd.
    year: 2011
    edition: Issue D, ARM IHI 0022D (ID102711), Non-Confidential
    url: https://developer.arm.com/documentation/ihi0022/latest/
    pdf: amba-axi4.pdf
    text: null
    status: pdf-only
    role: Authoritative for AXI4 channel signals, handshake rules, response semantics, ordering and transaction attributes. Supplied by the user. Text extraction pending - needs pypdf, so it waits on the venv.
    word_count: 0
