# specgen/source/constants.yaml
# Language-neutral parameter defaults. Source of truth for both ni_params_pkg.sv
# and ni_params.h.
schema_version: "1.0"

axi:
  ID_WIDTH:
    type: int
    units: bits
    description: "AXI transaction ID width at the NI interface and in the flit"
    default: 8
    min: 1
    max: 32
    # This is the SLAVE-side width in AXI4 IHI 0022 §A5.3.6 terms: an initiator's
    # own ID plus the master-port index a tile interconnect appends (§A5.3.5).
    # 8 is that section's recommended slave-component width. INITIATOR_ID_WIDTH
    # below states the initiator's share; the rest is the index budget, so a tile
    # may carry 2^(ID_WIDTH - INITIATOR_ID_WIDTH) initiators.
    # NOTE: spec range is 1..32 per AXI4 IHI 0022 §A2.2.1, but c_model + DPI
    # currently hardcode 8 (see static_assert in c_model/include/axi/types.hpp
    # AXI_ID_SPACE check, and the AXI_ID_WIDTH wiring in sim/c/cmodel_dpi.cpp).
    # Widen the impl side before relaxing this max.
    sv_symbol: AXI_ID_WIDTH_DFLT
    cpp_symbol: AXI_ID_WIDTH
  INITIATOR_ID_WIDTH:
    type: int
    units: bits
    description: "AXI transaction ID width one tile initiator may drive"
    default: 4
    min: 1
    max: 32
    # AXI4 IHI 0022 §A5.3.6 recommends up to 4 bits at a master component and up
    # to 4 more for the interconnect's master-port number. Same split as pulp
    # axi_xbar (AxiIdWidthSlvPorts + $clog2(NoSlvPorts), doc/axi_xbar.md) and as
    # FlooNoC's per-manager id_width (3..5 across floogen/examples).
    # Must satisfy INITIATOR_ID_WIDTH + clog2(initiators per tile) <= ID_WIDTH.
    sv_symbol: AXI_INITIATOR_ID_WIDTH_DFLT
    cpp_symbol: AXI_INITIATOR_ID_WIDTH
  ADDR_WIDTH:
    type: int
    units: bits
    description: "AXI address bus width"
    default: 48
    min: 1
    max: 64
    # NOTE: spec range is 1..64 per AXI4 IHI 0022 §A2.2.1; default fixed at 48 b
    # per docs/noc-target-spec.md §6. The DPI pack_addr64 helper in
    # src/dpi/cmodel_dpi.cpp packs into a 2-word svBitVecVal[2] container
    # (unchanged: ceil(48/32) == ceil(64/32) == 2); widening past 64 still
    # needs pack_addr64 reparameterized.
    sv_symbol: AXI_ADDR_WIDTH_DFLT
    cpp_symbol: AXI_ADDR_WIDTH
  DATA_WIDTH:
    type: int
    units: bits
    description: "AXI data bus width"
    default: 512
    allowed: [32, 64, 128, 256, 512, 1024]
    # NOTE: spec allows the widths listed in `allowed`. The shared endpoint carries
    # the data class at this width (DATA_BYTES = 64 in c_model/include/axi/types.hpp,
    # and the parameterized data marshalling in sim/c/cmodel_dpi.cpp); the narrow
    # class rides the addressed 8 B lane of the same port (docs/noc-target-spec.md §5).
    sv_symbol: AXI_DATA_WIDTH_DFLT
    cpp_symbol: AXI_DATA_WIDTH
  AWUSER_WIDTH:
    type: int
    units: bits
    description: "AWUSER width at the NI slave port: 8 b opaque user + 2 b collective_op + 48 b collective address mask, per docs/noc-target-spec.md §6"
    default: 58
    min: 10
    max: 64
    # NOTE: the collective mask field is ADDR_WIDTH wide, so this default only
    # holds while ADDR_WIDTH == 48. The DPI carries AWUSER in a 2-word
    # svBitVecVal container (src/dpi/cmodel_dpi.cpp cmodel_nmu_set_inputs),
    # which is what caps this at 64.
    sv_symbol: AXI_AWUSER_WIDTH_DFLT
    cpp_symbol: AXI_AWUSER_WIDTH

noc:
  DAT_NUM_VC:
    type: int
    units: count
    description: "Number of virtual channels per NoC link (DAT network; REQ/RSP are single-VC, see REQ_NUM_VC/RSP_NUM_VC)"
    default: 1
    min: 1
    max: 8
    sv_symbol: NOC_DAT_NUM_VC_DFLT
    cpp_symbol: NOC_DAT_NUM_VC
  REQ_NUM_VC:
    type: int
    units: count
    description: "Number of virtual channels on the REQ network (NarrowAw/NarrowW/NarrowAr/DataAr); spec ready/valid TXREQREADY is scalar, so this defaults to 1"
    default: 1
    min: 1
    max: 8
    sv_symbol: NOC_REQ_NUM_VC_DFLT
    cpp_symbol: NOC_REQ_NUM_VC
  RSP_NUM_VC:
    type: int
    units: count
    description: "Number of virtual channels on the RSP network (NarrowB/NarrowR/DataB); spec ready/valid TXRSPREADY is scalar, so this defaults to 1"
    default: 1
    min: 1
    max: 8
    sv_symbol: NOC_RSP_NUM_VC_DFLT
    cpp_symbol: NOC_RSP_NUM_VC
  REQ_FLIT_WIDTH:
    type: int
    units: bits
    description: "REQ network flit width: HEADER_WIDTH(44) + max(AW/AR payload, 93) = 137, per docs/noc-target-spec.md §6"
    default: 137
    min: 64
    max: 1024
    sv_symbol: NOC_REQ_FLIT_WIDTH_DFLT
    cpp_symbol: NOC_REQ_FLIT_WIDTH
  RSP_FLIT_WIDTH:
    type: int
    units: bits
    description: "RSP network flit width: HEADER_WIDTH(44) + max(B/NARROW_R payload, 83) = 127, per docs/noc-target-spec.md §6"
    default: 127
    min: 64
    max: 1024
    sv_symbol: NOC_RSP_FLIT_WIDTH_DFLT
    cpp_symbol: NOC_RSP_FLIT_WIDTH
  DAT_FLIT_WIDTH:
    type: int
    units: bits
    description: "DAT network flit width: HEADER_WIDTH(44) + max(AW/DATA_W/DATA_R payload, 585) = 629, per docs/noc-target-spec.md §6"
    default: 629
    min: 64
    max: 1024
    sv_symbol: NOC_DAT_FLIT_WIDTH_DFLT
    cpp_symbol: NOC_DAT_FLIT_WIDTH
  ROUTER_VC_DEPTH:
    type: int
    units: flits
    description: "Router input VC FIFO depth; defines the credit seed of the upstream sender"
    default: 8
    min: 1
    max: 16
    sv_symbol: NOC_ROUTER_VC_DEPTH_DFLT
    cpp_symbol: NOC_ROUTER_VC_DEPTH
  ROUTER_OUTPUT_FIFO_DEPTH:
    type: int
    units: flits
    description: "Router output FIFO depth (stage 3); not credit-counted"
    default: 2
    min: 1
    max: 16
    sv_symbol: NOC_ROUTER_OUTPUT_FIFO_DEPTH_DFLT
    cpp_symbol: NOC_ROUTER_OUTPUT_FIFO_DEPTH
  MESH_X_DIM:
    type: int
    units: count
    description: "Mesh X dimension (routers per row); bounded by X_WIDTH (4 bit); minimum 2 (a mesh communicating through NI + router needs at least 2x2, per dimension)"
    default: 4
    min: 2
    max: 16
    sv_symbol: NOC_MESH_X_DIM_DFLT
    cpp_symbol: NOC_MESH_X_DIM
  MESH_Y_DIM:
    type: int
    units: count
    description: "Mesh Y dimension (routers per column); bounded by Y_WIDTH (4 bit); minimum 2 (a mesh communicating through NI + router needs at least 2x2, per dimension)"
    default: 4
    min: 2
    max: 16
    sv_symbol: NOC_MESH_Y_DIM_DFLT
    cpp_symbol: NOC_MESH_Y_DIM

nmu:
  ROB_B_DEPTH:
    type: int
    units: entries
    description: "NMU write-response RoB pool depth. <= 2^ORDERING_TAG_WIDTH."
    default: 128
    min: 1
    max: 256
    sv_symbol: NMU_ROB_B_DEPTH_DFLT
    cpp_symbol: NMU_ROB_B_DEPTH
  ROB_R_DEPTH:
    type: int
    units: entries
    description: "NMU read-response RoB pool depth. Holds one rdata beat per slot."
    default: 128
    min: 1
    max: 256
    sv_symbol: NMU_ROB_R_DEPTH_DFLT
    cpp_symbol: NMU_ROB_R_DEPTH
  MAX_TXNS_PER_ID:
    type: int
    units: transactions
    description: "Transactions in flight per AXI ID at the NMU. Bounds the per-ID order list, which holds bypassed and reordered transactions alike -- a bypassed push allocates no RoB slot but still takes a list entry (FlooNoC MaxTxnsPerId)."
    default: 32
    min: 1
    max: 256
    sv_symbol: NMU_MAX_TXNS_PER_ID_DFLT
    cpp_symbol: NMU_MAX_TXNS_PER_ID
  OUTSTANDING_DEPTH:
    type: int
    units: transactions
    description: "NMU shared outstanding-transaction pool depth, per direction (AW and AR independent, shared across all AXI IDs)."
    default: 32
    min: 1
    max: 256
    sv_symbol: NMU_OUTSTANDING_DEPTH_DFLT
    cpp_symbol: NMU_OUTSTANDING_DEPTH
  QUEUE_DEPTH:
    type: int
    units: beats
    description: "NMU slave-port AXI-channel FIFO depth (shared by AW/W/AR/B/R)."
    default: 16
    min: 1
    max: 1024
    sv_symbol: NMU_QUEUE_DEPTH_DFLT
    cpp_symbol: NMU_QUEUE_DEPTH
  DEPKT_Q_DEPTH:
    type: int
    units: beats
    description: "NMU Depacketize demux FIFO depth (shared by B/R)."
    default: 16
    min: 1
    max: 1024
    sv_symbol: NMU_DEPKT_Q_DEPTH_DFLT
    cpp_symbol: NMU_DEPKT_Q_DEPTH
  ARBITER_FIFO_DEPTH:
    type: int
    units: entries
    description: "NMU wormhole per-input + VC-arbiter pending staging depth."
    default: 4
    min: 1
    max: 64
    sv_symbol: NMU_ARBITER_FIFO_DEPTH_DFLT
    cpp_symbol: NMU_ARBITER_FIFO_DEPTH

nsu:
  QUEUE_DEPTH:
    type: int
    units: beats
    description: "NSU master-port AXI-channel FIFO depth (shared by AW/W/AR/B/R)."
    default: 16
    min: 1
    max: 1024
    sv_symbol: NSU_QUEUE_DEPTH_DFLT
    cpp_symbol: NSU_QUEUE_DEPTH
  META_BUFFER_MAX_OUTSTANDING:
    type: int
    units: transactions
    description: "NSU MetaBuffer shared outstanding pool size, per direction."
    default: 32
    min: 1
    max: 256
    sv_symbol: NSU_META_BUFFER_MAX_OUTSTANDING_DFLT
    cpp_symbol: NSU_META_BUFFER_MAX_OUTSTANDING
  META_BUFFER_MAX_UNIQUE_IDS:
    type: int
    units: count
    description: "Distinct AXI IDs the NSU presents downstream (1 collapses; 256 passes through)."
    default: 1
    allowed: [1, 256]
    sv_symbol: NSU_META_BUFFER_MAX_UNIQUE_IDS_DFLT
    cpp_symbol: NSU_META_BUFFER_MAX_UNIQUE_IDS
  ARBITER_FIFO_DEPTH:
    type: int
    units: entries
    description: "NSU wormhole per-input + VC-arbiter pending staging depth."
    default: 4
    min: 1
    max: 64
    sv_symbol: NSU_ARBITER_FIFO_DEPTH_DFLT
    cpp_symbol: NSU_ARBITER_FIFO_DEPTH

derived:
  WSTRB_WIDTH:
    type: int
    units: bits
    description: "AXI write strobe width"
    expression: "DATA_WIDTH / 8"
    constraint: "DATA_WIDTH % 8 == 0"
    sv_symbol: AXI_WSTRB_WIDTH_DFLT
    cpp_symbol: AXI_WSTRB_WIDTH
