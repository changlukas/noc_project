schema_version: '1.0'
axi:
  AXI_ID_WIDTH:
    type: int
    units: bits
    description: External AXI transaction ID width at the NI interface
    default: 3
    min: 1
    max: 8
    sv_symbol: AXI_ID_WIDTH
    cpp_symbol: AXI_ID_WIDTH
  NOC_ID_WIDTH:
    type: int
    units: bits
    description: Fixed NoC transaction ID width after AXI-ID remapping
    default: 3
    allowed:
    - 3
    sv_symbol: NOC_ID_WIDTH
    cpp_symbol: NOC_ID_WIDTH
  ADDR_WIDTH:
    type: int
    units: bits
    description: AXI address bus width
    default: 48
    min: 1
    max: 64
    sv_symbol: AXI_ADDR_WIDTH
    cpp_symbol: AXI_ADDR_WIDTH
  DATA_WIDTH:
    type: int
    units: bits
    description: AXI data bus width
    default: 512
    allowed:
    - 32
    - 64
    - 128
    - 256
    - 512
    - 1024
    sv_symbol: AXI_DATA_WIDTH
    cpp_symbol: AXI_DATA_WIDTH
  AWUSER_WIDTH:
    type: int
    units: bits
    description: "AWUSER width at the NI slave port: 8 b opaque user + 2 b collective_op\
      \ + 48 b collective address mask, per docs/noc-target-spec.md \xA76"
    default: 58
    min: 10
    max: 64
    sv_symbol: AXI_AWUSER_WIDTH
    cpp_symbol: AXI_AWUSER_WIDTH
  FIFO_DEPTH:
    type: int
    units: entries
    description: Common depth of the five AXI-channel asynchronous FIFOs in an NMU
      or NSU; power of two and at least 2
    default: 8
    min: 2
    sv_symbol: AXI_FIFO_DEPTH
    cpp_symbol: AXI_FIFO_DEPTH
noc:
  DAT_VC_MODE_SHARED:
    type: int
    units: mode
    description: Encoding of the SHARED DAT VC allocation policy
    default: 0
    allowed:
    - 0
    sv_symbol: NOC_DAT_VC_MODE_SHARED
    cpp_symbol: NOC_DAT_VC_MODE_SHARED
  DAT_VC_MODE_READ_WRITE_SPLIT:
    type: int
    units: mode
    description: Encoding of the READ_WRITE_SPLIT DAT VC allocation policy
    default: 1
    allowed:
    - 1
    sv_symbol: NOC_DAT_VC_MODE_READ_WRITE_SPLIT
    cpp_symbol: NOC_DAT_VC_MODE_READ_WRITE_SPLIT
  DAT_VC_MODE:
    type: int
    units: mode
    description: 'DAT VC allocation policy: 0 = SHARED, 1 = READ_WRITE_SPLIT'
    default: 0
    allowed:
    - 0
    - 1
    sv_symbol: NOC_DAT_VC_MODE
    cpp_symbol: NOC_DAT_VC_MODE
  DAT_NUM_VC:
    type: int
    units: count
    description: Number of virtual channels per NoC link (DAT network; REQ/RSP are
      single-VC)
    default: 2
    min: 1
    max: 8
    sv_symbol: NUM_DAT_VC
    cpp_symbol: NOC_DAT_NUM_VC
  REQ_FLIT_WIDTH:
    type: int
    units: bits
    description: "REQ network flit width: HEADER_WIDTH(48) + max(AW/AR payload, 88)\
      \ = 136, per docs/noc-target-spec.md \xA76"
    default: 136
    min: 64
    max: 1024
    sv_symbol: NOC_REQ_FLIT_WIDTH
    cpp_symbol: NOC_REQ_FLIT_WIDTH
  RSP_FLIT_WIDTH:
    type: int
    units: bits
    description: "RSP network flit width: HEADER_WIDTH(48) + max(B/NARROW_R payload,\
      \ 78) = 126, per docs/noc-target-spec.md \xA76"
    default: 126
    min: 64
    max: 1024
    sv_symbol: NOC_RSP_FLIT_WIDTH
    cpp_symbol: NOC_RSP_FLIT_WIDTH
  DAT_FLIT_WIDTH:
    type: int
    units: bits
    description: "DAT network flit width: HEADER_WIDTH(48) + max(AW/DATA_W/DATA_R\
      \ payload, 585) = 633, per docs/noc-target-spec.md \xA76"
    default: 633
    min: 64
    max: 1024
    sv_symbol: NOC_DAT_FLIT_WIDTH
    cpp_symbol: NOC_DAT_FLIT_WIDTH
  FIFO_DEPTH:
    type: int
    units: entries
    description: Common depth of the REQ, RSP, DAT Write and DAT Read synchronous
      NoC-class FIFOs in an NMU or NSU; positive power of two
    default: 8
    min: 1
    sv_symbol: NOC_FIFO_DEPTH
    cpp_symbol: NOC_FIFO_DEPTH
  ROUTER_VC_DEPTH:
    type: int
    units: flits
    description: Router input VC FIFO depth; power of two and at least 2; defines
      the credit seed of the upstream sender
    default: 32
    min: 2
    sv_symbol: NOC_ROUTER_VC_DEPTH
    cpp_symbol: NOC_ROUTER_VC_DEPTH
  NI_DAT_RX_VC_DEPTH:
    type: int
    units: flits
    description: NI DAT receive FIFO depth per VC; power of two and at least 2; defaults
      to the Router VC depth and defines the Router LOCAL sender credit seed
    default: 32
    min: 2
    sv_symbol: NOC_NI_DAT_RX_VC_DEPTH
    cpp_symbol: NOC_NI_DAT_RX_VC_DEPTH
  ROUTER_OUTPUT_FIFO_DEPTH:
    type: int
    units: flits
    description: Router output FIFO depth (stage 3); positive power of two; not credit-counted
    default: 8
    min: 1
    sv_symbol: NOC_ROUTER_OUTPUT_FIFO_DEPTH
    cpp_symbol: NOC_ROUTER_OUTPUT_FIFO_DEPTH
  MESH_X_DIM:
    type: int
    units: count
    description: Mesh X dimension (routers per row); power of two; bounded by X_WIDTH
      (4 bit); minimum 2
    default: 4
    allowed:
    - 2
    - 4
    - 8
    - 16
    sv_symbol: NOC_MESH_X_DIM
    cpp_symbol: NOC_MESH_X_DIM
  MESH_Y_DIM:
    type: int
    units: count
    description: Mesh Y dimension (routers per column); power of two; bounded by Y_WIDTH
      (4 bit); minimum 2
    default: 4
    allowed:
    - 2
    - 4
    - 8
    - 16
    sv_symbol: NOC_MESH_Y_DIM
    cpp_symbol: NOC_MESH_Y_DIM
nmu:
  READ_ROB_ENABLED:
    type: int
    units: mode
    description: NMU read reorder buffer. 1 = the reorder-buffer response path docs/noc-target-spec.md
      section 3 describes; 0 = the RoBless bypass with its per-AXI-ID single-outstanding
      interlock. Write responses take the RoB in both modes.
    default: 1
    min: 0
    max: 1
    sv_symbol: NMU_R_ROB_EN
    cpp_symbol: NMU_READ_ROB_ENABLED
  ROB_B_DEPTH:
    type: int
    units: entries
    description: NMU write-response RoB pool depth. <= 2^ORDERING_TAG_WIDTH.
    default: 128
    min: 1
    max: 256
    sv_symbol: NMU_ROB_B_DEPTH
    cpp_symbol: NMU_ROB_B_DEPTH
  ROB_R_DEPTH:
    type: int
    units: entries
    description: NMU read-response RoB pool depth. Holds one rdata beat per slot.
    default: 128
    min: 1
    max: 256
    sv_symbol: NMU_ROB_R_DEPTH
    cpp_symbol: NMU_ROB_R_DEPTH
  MAX_TXNS_PER_ID:
    type: int
    units: transactions
    description: Transactions in flight per AXI ID at the NMU. Bounds the per-ID order
      list, which holds bypassed and reordered transactions alike -- a bypassed push
      allocates no RoB slot but still takes a list entry (FlooNoC MaxTxnsPerId).
    default: 32
    min: 1
    max: 256
    sv_symbol: NMU_MAX_OUTSTANDING_PER_ID
    cpp_symbol: NMU_MAX_TXNS_PER_ID
  QUEUE_DEPTH:
    type: int
    units: beats
    description: NMU slave-port AXI-channel FIFO depth (shared by AW/W/AR/B/R).
    default: 16
    min: 1
    max: 1024
    sv_symbol: NMU_QUEUE_DEPTH
    cpp_symbol: NMU_QUEUE_DEPTH
  DEPKT_Q_DEPTH:
    type: int
    units: beats
    description: NMU Depacketize demux FIFO depth (shared by B/R).
    default: 16
    min: 1
    max: 1024
    sv_symbol: NMU_DEPKT_Q_DEPTH
    cpp_symbol: NMU_DEPKT_Q_DEPTH
  ARBITER_FIFO_DEPTH:
    type: int
    units: entries
    description: NMU wormhole per-input + VC-arbiter pending staging depth.
    default: 4
    min: 1
    max: 64
    sv_symbol: NMU_ARBITER_FIFO_DEPTH
    cpp_symbol: NMU_ARBITER_FIFO_DEPTH
nsu:
  AXI_ID_WIDTH:
    type: int
    units: bits
    description: AXI transaction ID width driven by the NSU downstream interface.
    default: 3
    min: 1
    max: 8
    sv_symbol: NSU_AXI_ID_WIDTH
    cpp_symbol: NSU_AXI_ID_WIDTH
  MAX_ACTIVE_IDS:
    type: int
    units: count
    description: Maximum live downstream-ID mappings per NSU direction; must not exceed
      2^NSU_AXI_ID_WIDTH.
    default: 8
    min: 1
    max: 256
    sv_symbol: NSU_MAX_ACTIVE_IDS
    cpp_symbol: NSU_MAX_ACTIVE_IDS
  MAX_OUTSTANDING:
    type: int
    units: transactions
    description: Maximum Response Queue transaction records per NSU direction.
    default: 32
    min: 1
    max: 256
    sv_symbol: NSU_MAX_OUTSTANDING
    cpp_symbol: NSU_MAX_OUTSTANDING
  QUEUE_DEPTH:
    type: int
    units: beats
    description: NSU master-port AXI-channel FIFO depth (shared by AW/W/AR/B/R).
    default: 16
    min: 1
    max: 1024
    sv_symbol: NSU_QUEUE_DEPTH
    cpp_symbol: NSU_QUEUE_DEPTH
  META_BUFFER_MAX_OUTSTANDING:
    type: int
    units: transactions
    description: NSU MetaBuffer shared outstanding pool size, per direction.
    default: 32
    min: 1
    max: 256
    sv_symbol: NSU_META_BUFFER_MAX_OUTSTANDING
    cpp_symbol: NSU_META_BUFFER_MAX_OUTSTANDING
  META_BUFFER_MAX_UNIQUE_IDS:
    type: int
    units: count
    description: 'Distinct AXI IDs the NSU presents downstream (1 collapses; 8 passes
      through). Default passthrough: the upstream ID reaches the slave unchanged.'
    default: 8
    allowed:
    - 1
    - 8
    sv_symbol: NSU_META_BUFFER_MAX_UNIQUE_IDS
    cpp_symbol: NSU_META_BUFFER_MAX_UNIQUE_IDS
  ARBITER_FIFO_DEPTH:
    type: int
    units: entries
    description: NSU wormhole per-input + VC-arbiter pending staging depth.
    default: 4
    min: 1
    max: 64
    sv_symbol: NSU_ARBITER_FIFO_DEPTH
    cpp_symbol: NSU_ARBITER_FIFO_DEPTH
