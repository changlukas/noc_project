topology:
  name: mesh_2x4_config_narrow_vc1
  x_dim: 4
  y_dim: 2
  num_vc: 1

# S4 T6 config-narrow multicast topology: rectangular 4x2 mesh, every node
# with a memory-space (data class) tile AND a config-space (narrow class)
# tile, so narrow multicast gets a non-trivial spanning tree (the 2x2
# config topology's row/col/submesh masks degenerate).
# Uniform sizes in raster order make both spaces AWUSER-mask friendly:
# memory bases = idx * 0x100000 (node-index bits [22:20]), config bases =
# 0x800000 + idx * 0x1000 (node-index bits [14:12]) -- required by the
# multicast pattern (replica addresses differ only in node-index bits).
address_map:
  tiles:
    - { x: 0, y: 0, size: 0x100000 }
    - { x: 1, y: 0, size: 0x100000 }
    - { x: 2, y: 0, size: 0x100000 }
    - { x: 3, y: 0, size: 0x100000 }
    - { x: 0, y: 1, size: 0x100000 }
    - { x: 1, y: 1, size: 0x100000 }
    - { x: 2, y: 1, size: 0x100000 }
    - { x: 3, y: 1, size: 0x100000 }
    - { x: 0, y: 0, size: 0x1000, space: config }
    - { x: 1, y: 0, size: 0x1000, space: config }
    - { x: 2, y: 0, size: 0x1000, space: config }
    - { x: 3, y: 0, size: 0x1000, space: config }
    - { x: 0, y: 1, size: 0x1000, space: config }
    - { x: 1, y: 1, size: 0x1000, space: config }
    - { x: 2, y: 1, size: 0x1000, space: config }
    - { x: 3, y: 1, size: 0x1000, space: config }
