topology:
  name: mesh_2x4_vc1
  x_dim: 4
  y_dim: 2
  num_vc: 1

# Memory-only tile map: 1 MB per node, no config tile, so the tile decoder is
# TILE_TARGETS = 1. The two *_config_narrow_* topologies carry the two-space
# shape; between them both crossbar paths stay exercised.
address_map:
  tiles:
    - { x: 0, y: 0, size: 0x100000 }
    - { x: 1, y: 0, size: 0x100000 }
    - { x: 2, y: 0, size: 0x100000 }
    - { x: 3, y: 0, size: 0x100000 }
    - { x: 0, y: 1, size: 0x100000 }
    - { x: 1, y: 1, size: 0x100000 }
    - { x: 2, y: 1, size: 0x100000 }
    - { x: 3, y: 1, size: 0x100000 }
