topology:
  name: mesh_4x4_vc4
  x_dim: 4
  y_dim: 4
  num_vc: 4

# Tile-major tile map: every node's memory-space (data class) and config-space
# (narrow class) tiles sit inside that node's own 0x100000000 block, memory at
# offset 0, config at 0x2000000.
# docs/noc-target-spec.md §5 "SAM address spaces" -- a node carries one memory
# tile and one config tile (nmu::addr_trans::SamTable::validate).
# Bases come from the coordinate and block_size, not list order: base =
# idx * block_size + offset[space]. Uniform sizes in raster order make both
# spaces AWUSER-mask friendly: memory bases = idx * 0x100000000 (node-index
# bits [35:32]), config bases = idx * 0x100000000 + 0x2000000 (node-index bits
# also [35:32]) -- required by the multicast pattern (replica addresses differ
# only in node-index bits).
address_map:
  block_size: 0x100000000
  tiles:
    - { x: 0, y: 0, size: 0x2000000 }
    - { x: 1, y: 0, size: 0x2000000 }
    - { x: 2, y: 0, size: 0x2000000 }
    - { x: 3, y: 0, size: 0x2000000 }
    - { x: 0, y: 1, size: 0x2000000 }
    - { x: 1, y: 1, size: 0x2000000 }
    - { x: 2, y: 1, size: 0x2000000 }
    - { x: 3, y: 1, size: 0x2000000 }
    - { x: 0, y: 2, size: 0x2000000 }
    - { x: 1, y: 2, size: 0x2000000 }
    - { x: 2, y: 2, size: 0x2000000 }
    - { x: 3, y: 2, size: 0x2000000 }
    - { x: 0, y: 3, size: 0x2000000 }
    - { x: 1, y: 3, size: 0x2000000 }
    - { x: 2, y: 3, size: 0x2000000 }
    - { x: 3, y: 3, size: 0x2000000 }
    - { x: 0, y: 0, size: 0x1000, space: config }
    - { x: 1, y: 0, size: 0x1000, space: config }
    - { x: 2, y: 0, size: 0x1000, space: config }
    - { x: 3, y: 0, size: 0x1000, space: config }
    - { x: 0, y: 1, size: 0x1000, space: config }
    - { x: 1, y: 1, size: 0x1000, space: config }
    - { x: 2, y: 1, size: 0x1000, space: config }
    - { x: 3, y: 1, size: 0x1000, space: config }
    - { x: 0, y: 2, size: 0x1000, space: config }
    - { x: 1, y: 2, size: 0x1000, space: config }
    - { x: 2, y: 2, size: 0x1000, space: config }
    - { x: 3, y: 2, size: 0x1000, space: config }
    - { x: 0, y: 3, size: 0x1000, space: config }
    - { x: 1, y: 3, size: 0x1000, space: config }
    - { x: 2, y: 3, size: 0x1000, space: config }
    - { x: 3, y: 3, size: 0x1000, space: config }
