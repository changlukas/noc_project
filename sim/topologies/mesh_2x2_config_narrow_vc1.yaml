topology:
  name: mesh_2x2_config_narrow_vc1
  x_dim: 2
  y_dim: 2
  num_vc: 1

# S2 T2d config-space narrow smoke topology: every node gets its memory-space
# (data class) tile, node (0,0) additionally gets a config-space (narrow
# class) tile. docs/noc-target-spec.md §5 "SAM address spaces" -- a node may
# carry one memory tile and, optionally, one config tile (nmu::addr_trans::
# SamTable::validate).
address_map:
  tiles:
    - { x: 0, y: 0, size: 0x100000 }
    - { x: 1, y: 0, size: 0x100000 }
    - { x: 0, y: 1, size: 0x100000 }
    - { x: 1, y: 1, size: 0x100000 }
    - { x: 0, y: 0, size: 0x1000, space: config }
